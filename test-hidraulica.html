<!doctype html>
<meta charset="utf-8">
<title>Prueba hidráulica</title>
<pre id="o" style="font:12px monospace"></pre>
<script type="module">
import { solveHydraulics, setDN, GEOM } from './js/hydraulics.js';
const o = document.getElementById('o');
const out = [];
const t0 = performance.now();
let runs = 0;
for (const dn of [100, 150, 300, 400]) {
  setDN(dn);
  out.push(`\n== DN${dn} ==  H\tcaso\treg\tQ L/s\tfSens\tvSens\tFrSens\tpSens\tpool/D\tfOut\tvOut`);
  for (const H of [0.1, 0.3, 0.6, 1.0, 1.6, 2.5]) {
    for (const kind of ['simple', 'goose']) {
      const r = solveHydraulics(H, Math.PI / 4, 0.009, kind); runs++;
      out.push([H, kind, r.regime, (r.Q * 1000).toFixed(1), r.sensor.f.toFixed(3), r.sensor.v.toFixed(2), r.sensor.Fr.toFixed(2),
        r.sensor.pressure != null ? r.sensor.pressure.toFixed(2) : '-', r.pool != null ? (r.pool / GEOM.D).toFixed(2) : '-',
        r.outlet.f.toFixed(3), r.outlet.v.toFixed(2)].join('\t'));
    }
  }
}
setDN(150);
const g = solveHydraulics(1.6, Math.PI / 4, 0.009, 'goose');
const prof = [];
for (let sv = 0; sv <= g.path.total; sv += 0.25) { const p = g.path.at(sv); prof.push(`${sv.toFixed(2)}:${g.sample(sv, g.f).toFixed(2)}@(${p.x.toFixed(2)},${p.y.toFixed(2)},${(p.phi * 180 / Math.PI).toFixed(0)}°)`); }
o.textContent = out.join('\n') + `\n\nms por solución: ${((performance.now() - t0) / runs).toFixed(1)}` +
  `\n\nDN150 goose: sDrop0=${g.path.sDrop0.toFixed(2)} sLow0=${g.path.sLow0.toFixed(2)} sSensor=${g.path.sSensor.toFixed(2)} sLow1=${g.path.sLow1.toFixed(2)} sCrest0=${g.path.sCrest0.toFixed(2)} sBrink=${g.path.sBrink.toFixed(2)} total=${g.path.total.toFixed(2)} hDrop=${g.path.hDrop.toFixed(2)} headLoss=${g.headLoss.toFixed(3)}` +
  `\nperfil: ${prof.join('  ')}`;
</script>
